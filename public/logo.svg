<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: Stylized AI Brain / Circuit -->
  <!-- Outer hexagon ring -->
  <polygon points="30,4 50,14 50,44 30,54 10,44 10,14" stroke="url(#iconGrad)" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.7"/>

  <!-- Inner hexagon -->
  <polygon points="30,12 44,20 44,38 30,46 16,38 16,20" stroke="url(#iconGrad)" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Center brain/circuit nodes -->
  <!-- Central node -->
  <circle cx="30" cy="29" r="4" fill="url(#iconGrad)" filter="url(#glow-strong)"/>

  <!-- Orbital nodes -->
  <circle cx="30" cy="17" r="2.5" fill="#3B82F6" filter="url(#glow)" opacity="0.9"/>
  <circle cx="30" cy="41" r="2.5" fill="#8B5CF6" filter="url(#glow)" opacity="0.9"/>
  <circle cx="20" cy="23" r="2" fill="#60A5FA" filter="url(#glow)" opacity="0.8"/>
  <circle cx="40" cy="23" r="2" fill="#7C3AED" filter="url(#glow)" opacity="0.8"/>
  <circle cx="20" cy="35" r="2" fill="#818CF8" filter="url(#glow)" opacity="0.8"/>
  <circle cx="40" cy="35" r="2" fill="#6D28D9" filter="url(#glow)" opacity="0.8"/>

  <!-- Connection lines: center to nodes -->
  <line x1="30" y1="25" x2="30" y2="19.5" stroke="url(#iconGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="33" x2="30" y2="38.5" stroke="url(#iconGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="26.5" y1="27" x2="21.5" y2="24" stroke="url(#iconGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="33.5" y1="27" x2="38.5" y2="24" stroke="url(#iconGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="26.5" y1="31" x2="21.5" y2="34" stroke="url(#iconGrad)" stroke-width="1" opacity="0.6"/>
  <line x1="33.5" y1="31" x2="38.5" y2="34" stroke="url(#iconGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Cross-connections between nodes -->
  <line x1="20" y1="23" x2="20" y2="35" stroke="#4F46E5" stroke-width="0.7" opacity="0.4"/>
  <line x1="40" y1="23" x2="40" y2="35" stroke="#4F46E5" stroke-width="0.7" opacity="0.4"/>
  <line x1="20" y1="23" x2="30" y2="17" stroke="#4F46E5" stroke-width="0.7" opacity="0.4"/>
  <line x1="40" y1="23" x2="30" y2="17" stroke="#4F46E5" stroke-width="0.7" opacity="0.4"/>
  <line x1="20" y1="35" x2="30" y2="41" stroke="#4F46E5" stroke-width="0.7" opacity="0.4"/>
  <line x1="40" y1="35" x2="30" y2="41" stroke="#4F46E5" stroke-width="0.7" opacity="0.4"/>

  <!-- "AI" text inside icon area (small) -->
  <text x="27" y="32" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="white" opacity="0.95" letter-spacing="0.5">AI</text>

  <!-- Separator line -->
  <line x1="64" y1="12" x2="64" y2="48" stroke="url(#iconGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Company Name Text -->
  <!-- "AI Tool" -->
  <text x="72" y="28" font-family="'Arial Black', Arial, sans-serif" font-weight="800" font-size="15" fill="url(#textGrad)" letter-spacing="0.5" filter="url(#glow)">AI Tool</text>
  <!-- "Creator" -->
  <text x="72" y="46" font-family="'Arial Black', Arial, sans-serif" font-weight="800" font-size="15" fill="white" letter-spacing="0.5" opacity="0.95">Creator</text>

  <!-- Tagline -->
  <text x="73" y="56" font-family="Arial, sans-serif" font-size="6" fill="#60A5FA" letter-spacing="1.5" opacity="0.7">BUILD · AUTOMATE · SCALE</text>
</svg>
