<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base with Rounded Corners & Dark Navy Surface -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg)" stroke="url(#brandGradient)" stroke-width="12" />

  <!-- Outer Ring Glow -->
  <rect x="32" y="32" width="448" height="448" rx="84" fill="none" stroke="#6366F1" stroke-width="4" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- AI Bot Head / Brain Core -->
  <g transform="translate(106, 106) scale(12.5)" filter="url(#glow)">
    <!-- Antenna / Node -->
    <circle cx="12" cy="3" r="1.5" fill="#06B6D4" />
    <path d="M12 4.5V7" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Bot Head Frame -->
    <rect x="3" y="7" width="18" height="13" rx="3.5" fill="none" stroke="url(#brandGradient)" stroke-width="2" />
    
    <!-- Eyes -->
    <circle cx="8" cy="12.5" r="1.75" fill="#06B6D4" />
    <circle cx="16" cy="12.5" r="1.75" fill="#6366F1" />
    
    <!-- Smile / Interface Line -->
    <path d="M8.5 16.5h7" stroke="url(#brandGradient)" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Ears / Connectors -->
    <path d="M1.5 11.5h1.5M21 11.5h1.5" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
